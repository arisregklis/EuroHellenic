<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Library and study interior" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#123f6c"/>
      <stop offset="1"  stop-color="#071d39"/>
    </linearGradient>
    <radialGradient id="l-lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e4b557" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e4b557" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l-vig" cx=".5" cy=".45" r=".78">
      <stop offset=".5" stop-color="#071d39" stop-opacity="0"/>
      <stop offset="1"  stop-color="#071d39" stop-opacity=".82"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#l-bg)"/>

  <!-- arched windows -->
  <g opacity=".5">
    <path d="M80 200 a70 70 0 0 1 140 0 v250 h-140Z" fill="#2e86d0" opacity=".3"/>
    <path d="M80 200 a70 70 0 0 1 140 0 v250 h-140Z" fill="none" stroke="#c9a227" stroke-width="2"/>
    <path d="M150 130 v320 M80 300 h140" stroke="#c9a227" stroke-width="1.4" opacity=".7"/>

    <path d="M580 200 a70 70 0 0 1 140 0 v250 h-140Z" fill="#2e86d0" opacity=".3"/>
    <path d="M580 200 a70 70 0 0 1 140 0 v250 h-140Z" fill="none" stroke="#c9a227" stroke-width="2"/>
    <path d="M650 130 v320 M580 300 h140" stroke="#c9a227" stroke-width="1.4" opacity=".7"/>
  </g>

  <!-- bookshelves -->
  <g transform="translate(280 180)">
    <rect x="0" y="0" width="240" height="300" fill="#071d39" opacity=".7"/>
    <rect x="0" y="0" width="240" height="300" fill="none" stroke="#c9a227" stroke-width="1.6" opacity=".6"/>
    <g stroke="#c9a227" stroke-width="1.2" opacity=".5">
      <path d="M0 75 h240 M0 150 h240 M0 225 h240"/>
    </g>
    <g fill="#e4b557" opacity=".45">
      <rect x="10" y="22"  width="9"  height="50"/><rect x="23" y="30" width="7" height="42"/>
      <rect x="34" y="18"  width="11" height="54"/><rect x="49" y="28" width="8" height="44"/>
      <rect x="61" y="24"  width="10" height="48"/><rect x="75" y="34" width="7" height="38"/>
      <rect x="86" y="20"  width="9"  height="52"/><rect x="99" y="30" width="10" height="42"/>
      <rect x="10" y="98"  width="8"  height="49"/><rect x="22" y="104" width="10" height="43"/>
      <rect x="36" y="94"  width="9"  height="53"/><rect x="49" y="108" width="7" height="39"/>
      <rect x="60" y="100" width="11" height="47"/><rect x="75" y="96" width="8" height="51"/>
      <rect x="160" y="24" width="9"  height="48"/><rect x="173" y="32" width="8" height="40"/>
      <rect x="185" y="20" width="10" height="52"/><rect x="199" y="28" width="7" height="44"/>
      <rect x="160" y="100" width="8" height="47"/><rect x="172" y="94" width="10" height="53"/>
      <rect x="186" y="104" width="9" height="43"/><rect x="199" y="98" width="8" height="49"/>
      <rect x="14" y="172" width="10" height="51"/><rect x="28" y="180" width="8" height="43"/>
      <rect x="40" y="168" width="9"  height="55"/><rect x="53" y="178" width="10" height="45"/>
      <rect x="170" y="174" width="9" height="49"/><rect x="183" y="182" width="8" height="41"/>
      <rect x="195" y="170" width="10" height="53"/>
    </g>
  </g>

  <!-- reading desk with lamp glow -->
  <circle cx="400" cy="618" r="180" fill="url(#l-lamp)"/>
  <g transform="translate(250 580)">
    <rect x="0" y="60" width="300" height="10" fill="#c9a227" opacity=".8"/>
    <rect x="18" y="70" width="8" height="90" fill="#c9a227" opacity=".55"/>
    <rect x="274" y="70" width="8" height="90" fill="#c9a227" opacity=".55"/>
    <!-- open book -->
    <path d="M110 60 L150 44 L190 60 L150 52Z" fill="#f0dfae" opacity=".9"/>
    <path d="M110 60 L150 52 L150 44 L110 52Z" fill="#f0dfae" opacity=".6"/>
    <!-- lamp -->
    <rect x="222" y="14" width="5" height="46" fill="#e4b557" opacity=".8"/>
    <path d="M204 14 h42 l-10-20 h-22Z" fill="#e4b557" opacity=".85"/>
    <!-- laptop -->
    <path d="M44 60 h56 l8-34 h-72Z" fill="#2e86d0" opacity=".55"/>
  </g>

  <!-- seated figures -->
  <g fill="#e4b557" opacity=".5">
    <g><circle cx="196" cy="588" r="14"/><path d="M176 664 q20-52 40 0 z"/></g>
    <g><circle cx="604" cy="592" r="14"/><path d="M584 666 q20-50 40 0 z"/></g>
  </g>

  <!-- floor -->
  <rect y="740" width="800" height="260" fill="#071d39"/>
  <g stroke="#c9a227" stroke-width="1" opacity=".18">
    <path d="M0 740 H800 M0 812 H800 M0 890 H800 M0 968 H800"/>
    <path d="M160 740 V1000 M400 740 V1000 M640 740 V1000"/>
  </g>

  <rect width="800" height="1000" fill="url(#l-vig)"/>
</svg>
