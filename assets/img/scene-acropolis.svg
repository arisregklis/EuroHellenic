<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Classical Athenian architecture at dusk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#11406f"/>
      <stop offset=".45" stop-color="#0b2a4f"/>
      <stop offset="1"   stop-color="#071d39"/>
    </linearGradient>
    <linearGradient id="a-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4b557" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e4b557" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#f0dfae" stop-opacity=".95"/>
      <stop offset="1"  stop-color="#c9a227" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="a-vig" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#071d39" stop-opacity="0"/>
      <stop offset="1"   stop-color="#071d39" stop-opacity=".75"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#a-sky)"/>
  <circle cx="560" cy="330" r="230" fill="url(#a-sun)"/>
  <circle cx="560" cy="330" r="62" fill="#e4b557" opacity=".22"/>

  <!-- distant hills -->
  <path d="M0 640 L150 588 L300 628 L470 572 L640 620 L800 580 L800 1000 L0 1000Z" fill="#0b2a4f" opacity=".85"/>

  <!-- temple platform -->
  <g transform="translate(150 300)">
    <!-- pediment -->
    <path d="M-10 120 L250 20 L510 120 Z" fill="url(#a-stone)" opacity=".9"/>
    <path d="M-10 120 L250 20 L510 120 Z" fill="none" stroke="#f0dfae" stroke-width="2" opacity=".5"/>
    <!-- entablature -->
    <rect x="-22" y="120" width="544" height="26" fill="url(#a-stone)"/>
    <rect x="-14" y="146" width="528" height="12" fill="#c9a227" opacity=".45"/>
    <!-- triglyphs -->
    <g fill="#071d39" opacity=".35">
      <rect x="10"  y="124" width="10" height="18"/><rect x="70"  y="124" width="10" height="18"/>
      <rect x="130" y="124" width="10" height="18"/><rect x="190" y="124" width="10" height="18"/>
      <rect x="250" y="124" width="10" height="18"/><rect x="310" y="124" width="10" height="18"/>
      <rect x="370" y="124" width="10" height="18"/><rect x="430" y="124" width="10" height="18"/>
    </g>
    <!-- columns -->
    <g>
      <g id="col">
        <rect x="0" y="158" width="34" height="210" fill="url(#a-stone)"/>
        <g fill="#071d39" opacity=".18">
          <rect x="5"  y="158" width="2.5" height="210"/><rect x="12" y="158" width="2.5" height="210"/>
          <rect x="19" y="158" width="2.5" height="210"/><rect x="26" y="158" width="2.5" height="210"/>
        </g>
        <rect x="-5" y="152" width="44" height="8" fill="#f0dfae" opacity=".8"/>
      </g>
      <use href="#col" x="66"/>  <use href="#col" x="132"/> <use href="#col" x="198"/>
      <use href="#col" x="264"/> <use href="#col" x="330"/> <use href="#col" x="396"/>
      <use href="#col" x="462"/>
    </g>
    <!-- stylobate -->
    <rect x="-40" y="368" width="580" height="16" fill="url(#a-stone)"/>
    <rect x="-56" y="384" width="612" height="16" fill="#c9a227" opacity=".4"/>
    <rect x="-72" y="400" width="644" height="18" fill="#c9a227" opacity=".25"/>
  </g>

  <!-- rock outcrop -->
  <path d="M40 718 L180 690 L320 712 L470 686 L620 716 L760 700 L800 730 L800 1000 L0 1000 L0 742Z"
        fill="#071d39"/>
  <path d="M40 718 L180 690 L320 712 L470 686 L620 716 L760 700" fill="none"
        stroke="#c9a227" stroke-width="1.5" opacity=".35"/>

  <!-- city lights -->
  <g fill="#e4b557" opacity=".5">
    <circle cx="90"  cy="800" r="2"/><circle cx="150" cy="828" r="1.6"/><circle cx="220" cy="792" r="2.2"/>
    <circle cx="300" cy="842" r="1.6"/><circle cx="380" cy="806" r="2"/><circle cx="455" cy="856" r="1.8"/>
    <circle cx="530" cy="812" r="2.2"/><circle cx="610" cy="848" r="1.6"/><circle cx="690" cy="800" r="2"/>
    <circle cx="740" cy="860" r="1.8"/><circle cx="120" cy="900" r="1.7"/><circle cx="260" cy="918" r="2"/>
    <circle cx="420" cy="906" r="1.6"/><circle cx="580" cy="924" r="1.9"/><circle cx="700" cy="908" r="1.6"/>
  </g>

  <!-- vignette -->
  <rect width="800" height="1000" fill="url(#a-vig)"/>
</svg>
