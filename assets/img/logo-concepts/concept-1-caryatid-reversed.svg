<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="EuroHellenic — Caryatid concept">
  <!-- Wordmark set in <text>: Playfair Display where installed/loaded, Georgia fallback. -->
  <g transform="translate(-22 5) scale(1.17)">
  <defs>
    <mask id="rv-cary-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-width="1.4">
        <path d="M31 11.2 H89" stroke-linecap="butt" stroke-width="1.3"/>
        <path d="M54.6 26 H65.4" stroke-linecap="butt" stroke-width="1"/>
        <!-- hairline -->
        <path d="M55.4 35 Q60 31.4 64.6 35"/>
        <path d="M55 30.7 H65" stroke-linecap="butt" stroke-width="1"/>
        <!-- arms separated from the body -->
        <path d="M49.9 57 C49.6 62 49.2 68 48.8 73"/>
        <path d="M70.1 57 C70.4 62 70.8 68 71.2 73"/>
        <!-- bust / girdle -->
        <path d="M53.4 60.4 Q56.6 62.4 60 60.6 Q63.4 62.4 66.6 60.4" stroke-width="1.2"/>
        <!-- overfold folds -->
        <path d="M55.6 64.5 C54.8 70 53.8 75 53.2 81"/>
        <path d="M60 64.5 V82"/>
        <path d="M64.4 64.5 C65.2 70 66.2 75 66.8 81"/>
        <!-- overfold hem -->
        <path d="M47.6 80.6 Q54 84 60 82.4 Q66 84 72.4 80.6" stroke-width="1.6"/>
        <!-- relaxed leg: folds break round the bent knee -->
        <path d="M49.6 87 C50.2 93 50 99 49.4 106"/>
        <path d="M57.4 86.4 C57 89.4 56 92.2 54.8 94.4"/>
        <path d="M53.8 96.2 C53.2 99.6 52.7 102.8 52.5 106.2"/>
        <path d="M55.6 96.2 C56 99.6 56.5 102.8 56.8 106.2"/>
        <!-- between the legs -->
        <path d="M60.4 86 V106.4"/>
        <!-- weight-bearing leg: straight folds, like fluting -->
        <path d="M63.8 86 V106.4 M67 86 V106.4 M70.2 86 V106.4"/>
        <path d="M40 108.6 H80" stroke-linecap="butt" stroke-width="1.3"/>
      </g>
    </mask>
  </defs>
  <g fill="#ffffff" mask="url(#rv-cary-cut)">
    <!-- entablature -->
    <rect x="28" y="3" width="64" height="4.5"/>
    <rect x="31" y="7.5" width="58" height="7.5"/>
    <!-- capital: abacus, echinus, polos -->
    <rect x="48" y="17" width="24" height="3.5"/>
    <path d="M49 20.5 H71 C71 23.8 67 25.6 63 25.6 H57 C53 25.6 49 23.8 49 20.5 Z"/>
    <path d="M54.6 25.4 H65.4 L64.8 30.6 H55.2 Z"/>
    <!-- head -->
    <path d="M60 30 C65.2 30 65.6 33.4 65.4 37 C65.2 40.6 63 43.2 60 43.2 C57 43.2 54.8 40.6 54.6 37 C54.4 33.4 54.8 30 60 30 Z"/>
    <!-- locks of hair falling to the shoulders -->
    <path d="M55 33.8 C53.2 38.6 52.2 45 50.4 52 L53.4 52.4 C54.4 46 55.4 40.8 56.8 37.4 Z"/>
    <path d="M65 33.8 C66.8 38.6 67.8 45 69.6 52 L66.6 52.4 C65.6 46 64.6 40.8 63.2 37.4 Z"/>
    <!-- neck -->
    <rect x="58.1" y="41" width="3.8" height="9"/>
    <!-- arms -->
    <path d="M52 49.8 C48.4 50.1 46.4 51.2 45.6 53.6 C44.9 55.8 44.9 58.6 45 61.2 L44.5 70 C44.3 74 44.5 77.6 45.3 80.2 C45.9 81.6 47.9 81.6 48.3 80.2 C48.5 76 48.8 72 49.1 68 L49.8 61 C50.2 57 51 54 52.4 51 Z"/>
    <path d="M68 49.8 C71.6 50.1 73.6 51.2 74.4 53.6 C75.1 55.8 75.1 58.6 75 61.2 L75.5 70 C75.7 74 75.5 77.6 74.7 80.2 C74.1 81.6 72.1 81.6 71.7 80.2 C71.5 76 71.2 72 70.9 68 L70.2 61 C69.8 57 69 54 67.6 51 Z"/>
    <!-- chest and overfold (apoptygma) -->
    <path d="M60 49.2 C55 49.2 51.4 49.8 50.4 52 C50.6 57 51.4 61.4 51.3 66 C51 71 49.8 76 48.4 81 Q54 84.4 60 82.8 Q66 84.4 71.6 81 C70.2 76 69 71 68.7 66 C68.6 61.4 69.4 57 69.6 52 C68.6 49.8 65 49.2 60 49.2 Z"/>
    <!-- skirt -->
    <path d="M47.6 80 C47.2 88 47 96 47.2 102 C47.2 104.6 46.6 106.6 45.8 109 H74.2 C73.4 106.6 72.8 104.6 72.8 102 C73 96 72.8 88 72.4 80 Z"/>
    <!-- plinth -->
    <rect x="38" y="108.6" width="44" height="7"/>
  </g>
</g>
  <text x="118" y="84" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="60" fill="#ffffff">EuroHellenic</text>
  <line x1="121" y1="103" x2="151" y2="103" stroke="#8cc4f2" stroke-width="2"/>
  <text x="161" y="108" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.4" fill="#8cc4f2">EDUCATION &amp; STUDENT SERVICES</text>
</svg>
