<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-label="EuroHellenic — Meander monogram concept">
  <!-- Wordmark set in <text>: Playfair Display where installed/loaded, Georgia fallback. -->
  <g transform="translate(8 13) scale(1.03)">
  <rect x="2" y="2" width="116" height="116" fill="#0b2a4a"/>
  <rect x="8.5" y="8.5" width="103" height="103" fill="none" stroke="#8cc4f2" stroke-width="1.6"/>
  <!-- E and H as one unbroken Greek-key line: the base of the E runs on into the stem of the H -->
  <path fill="#ffffff" d="M22 24 H52 V34 H32 V55 H46 V65 H32 V86 H66 V24 H76 V55 H88 V24 H98 V96 H88 V65 H76 V96 H22 Z"/>
</g>
  <text x="158" y="76" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="7" fill="#ffffff">EUROHELLENIC</text>
  <rect x="160" y="92" width="410" height="1.6" fill="#8cc4f2"/>
  <text x="160" y="118" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="5.2" fill="#8cc4f2">EDUCATION &amp; STUDENT SERVICES</text>
</svg>
