    <path d="M40.6 92.4 C39.6 87.2 35.8 84 32.2 83.6 C33.4 88 36.6 91.4 40.6 92.4 Z"/>
    <path d="M76 92.6 C78.4 97.4 83 99.2 86.8 98.4 C84.4 94.4 80.4 92.4 76 92.6 Z"/>
    <path d="M86 92.6 C86.4 87.6 89.8 84 93.4 83.2 C93 87.8 90.2 91.4 86 92.6 Z"/>
    <path d="M94 93.4 C96.6 97.6 100.8 99 104.2 98.2 C101.8 94.6 98 93 94 93.4 Z"/>
    <circle cx="47.6" cy="92" r="2.1"/>
    <circle cx="80.4" cy="88.6" r="2.1"/>
