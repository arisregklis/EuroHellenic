<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="EuroHellenic — Owl of Athena concept">
  <!-- Wordmark set in <text>: Playfair Display where installed/loaded, Georgia fallback. -->
  <g transform="translate(10 13) scale(1.03)">
  <!-- coin-like roundel -->
  <circle cx="60" cy="60" r="57" fill="#0b2a4a"/>
  <circle cx="60" cy="60" r="51.5" fill="none" stroke="#8cc4f2" stroke-width="1.6"/>
  <!-- owl body with ear tufts -->
  <path fill="#ffffff" d="M60 32 C54 29.5 46 27.5 38.5 23 C40.5 29 40.8 35 39.6 42 C37.4 54 38.6 68 44 78 C47.6 84.6 53 88 60 88 C67 88 72.4 84.6 76 78 C81.4 68 82.6 54 80.4 42 C79.2 35 79.5 29 81.5 23 C74 27.5 66 29.5 60 32 Z"/>
