    <path d="M48 72.5 l3 2.6 l3 -2.6 M57 72.5 l3 2.6 l3 -2.6 M66 72.5 l3 2.6 l3 -2.6"/>
    <path d="M52.5 79 l3 2.6 l3 -2.6 M61.5 79 l3 2.6 l3 -2.6"/>
  </g>
  <!-- wings -->
