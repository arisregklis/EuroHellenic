  <g fill="#ffffff">
    <path d="M50.6 86 C50.6 89 51 91 52 92.4 C53 91 53.4 89.4 53.4 87 Z M53.8 87 C54 89.6 54.4 91.4 55.4 92.6 C56.4 91.4 56.8 89.6 56.8 87.4 Z"/>
    <path d="M69.4 86 C69.4 89 69 91 68 92.4 C67 91 66.6 89.4 66.6 87 Z M66.2 87 C66 89.6 65.6 91.4 64.6 92.6 C63.6 91.4 63.2 89.6 63.2 87.4 Z"/>
  </g>
</g>
  <text x="156" y="84" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="60" fill="#0b2a4a">Euro<tspan font-style="italic" fill="#0d5eaf">Hellenic</tspan></text>
  <text x="159" y="114" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.4" fill="#0b2a4a">EDUCATION &amp; STUDENT SERVICES</text>
