    <path d="M43.4 58 C43.4 68 45.8 76.6 50.4 83"/>
    <path d="M76.6 58 C76.6 68 74.2 76.6 69.6 83"/>
  </g>
  <!-- olive branch perch -->
  <defs><clipPath id="owl-clip"><circle cx="60" cy="60" r="49"/></clipPath></defs>
