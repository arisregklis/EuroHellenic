<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mediterranean coastline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1b5d96"/>
      <stop offset=".42" stop-color="#0b3a68"/>
      <stop offset="1"   stop-color="#071d39"/>
    </linearGradient>
    <linearGradient id="s-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b5ea8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#071d39" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="s-glow" cx=".62" cy=".3" r=".5">
      <stop offset="0" stop-color="#e4b557" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e4b557" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s-vig" cx=".5" cy=".42" r=".8">
      <stop offset=".52" stop-color="#071d39" stop-opacity="0"/>
      <stop offset="1"   stop-color="#071d39" stop-opacity=".78"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#s-sky)"/>
  <rect width="800" height="1000" fill="url(#s-glow)"/>
  <circle cx="500" cy="300" r="48" fill="#e4b557" opacity=".3"/>

  <!-- headland -->
  <path d="M0 520 L120 470 L230 512 L330 480 L430 520 L560 494 L700 528 L800 506 L800 560 L0 560Z"
        fill="#0b2a4f"/>

  <!-- whitewashed village -->
  <g fill="#f0dfae" opacity=".78">
    <rect x="90"  y="452" width="42" height="34" rx="1"/><path d="M86 452 l25-16 25 16Z"/>
    <rect x="146" y="462" width="34" height="26" rx="1"/><path d="M142 462 l21-13 21 13Z"/>
    <rect x="350" y="456" width="38" height="30" rx="1"/><path d="M346 456 l23-14 23 14Z"/>
    <rect x="400" y="468" width="30" height="24" rx="1"/><path d="M396 468 l19-12 19 12Z"/>
    <rect x="600" y="500" width="36" height="28" rx="1"/><path d="M596 500 l22-14 22 14Z"/>
  </g>
  <!-- domes -->
  <g fill="#2e86d0" opacity=".7">
    <path d="M196 486 a22 22 0 0 1 44 0Z"/>
    <path d="M470 490 a17 17 0 0 1 34 0Z"/>
  </g>
  <g fill="#f0dfae" opacity=".7">
    <rect x="196" y="486" width="44" height="20"/>
    <rect x="470" y="490" width="34" height="16"/>
  </g>

  <!-- sea -->
  <rect y="560" width="800" height="440" fill="url(#s-sea)"/>
  <g stroke="#2e86d0" stroke-width="1.4" fill="none" opacity=".38">
    <path d="M0 606 q60-12 120 0 t120 0 t120 0 t120 0 t120 0 t200 0"/>
    <path d="M0 664 q70-14 140 0 t140 0 t140 0 t140 0 t240 0"/>
    <path d="M0 726 q60-12 120 0 t120 0 t120 0 t120 0 t120 0 t200 0"/>
    <path d="M0 794 q70-14 140 0 t140 0 t140 0 t140 0 t240 0"/>
    <path d="M0 866 q60-12 120 0 t120 0 t120 0 t120 0 t120 0 t200 0"/>
    <path d="M0 938 q70-14 140 0 t140 0 t140 0 t140 0 t240 0"/>
  </g>
  <!-- sun path on water -->
  <g fill="#e4b557" opacity=".22">
    <rect x="470" y="596" width="62" height="5" rx="2"/>
    <rect x="456" y="650" width="90" height="5" rx="2"/>
    <rect x="444" y="712" width="114" height="5" rx="2"/>
    <rect x="432" y="782" width="138" height="5" rx="2"/>
    <rect x="420" y="858" width="162" height="5" rx="2"/>
  </g>
  <!-- sailboat -->
  <g opacity=".72">
    <path d="M660 556 l0-56 34 56Z" fill="#f0dfae"/>
    <path d="M656 556 l0-40 -24 40Z" fill="#f0dfae" opacity=".8"/>
    <path d="M622 558 h84 l-12 14 h-60Z" fill="#c9a227"/>
  </g>

  <rect width="800" height="1000" fill="url(#s-vig)"/>
</svg>
