<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="University campus building" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#164a80"/>
      <stop offset=".5"  stop-color="#0b2a4f"/>
      <stop offset="1"   stop-color="#071d39"/>
    </linearGradient>
    <linearGradient id="c-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dfae" stop-opacity=".82"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity=".38"/>
    </linearGradient>
    <radialGradient id="c-vig" cx=".5" cy=".4" r=".8">
      <stop offset=".5" stop-color="#071d39" stop-opacity="0"/>
      <stop offset="1"  stop-color="#071d39" stop-opacity=".8"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#c-sky)"/>
  <circle cx="200" cy="220" r="180" fill="#2e86d0" opacity=".14"/>

  <!-- main academic block -->
  <g transform="translate(100 250)">
    <!-- roof / pediment -->
    <path d="M-20 110 L300 30 L620 110 Z" fill="url(#c-face)" opacity=".85"/>
    <rect x="-30" y="110" width="660" height="22" fill="url(#c-face)"/>
    <!-- clock -->
    <circle cx="300" cy="82" r="21" fill="#071d39" opacity=".6"/>
    <circle cx="300" cy="82" r="21" fill="none" stroke="#e4b557" stroke-width="1.6"/>
    <path d="M300 82 V70 M300 82 L309 88" stroke="#e4b557" stroke-width="1.8" stroke-linecap="round"/>
    <!-- colonnade -->
    <g>
      <g id="ccol">
        <rect x="0" y="144" width="28" height="180" fill="url(#c-face)"/>
        <rect x="-4" y="138" width="36" height="7" fill="#f0dfae" opacity=".75"/>
        <g fill="#071d39" opacity=".16">
          <rect x="5" y="144" width="2" height="180"/><rect x="12" y="144" width="2" height="180"/>
          <rect x="19" y="144" width="2" height="180"/>
        </g>
      </g>
      <use href="#ccol" x="84"/> <use href="#ccol" x="168"/> <use href="#ccol" x="252"/>
      <use href="#ccol" x="336"/><use href="#ccol" x="420"/> <use href="#ccol" x="504"/>
      <use href="#ccol" x="572"/>
    </g>
    <!-- lit windows behind colonnade -->
    <g fill="#e4b557" opacity=".42">
      <rect x="42"  y="180" width="38" height="52" rx="2"/><rect x="126" y="180" width="38" height="52" rx="2"/>
      <rect x="210" y="180" width="38" height="52" rx="2"/><rect x="294" y="180" width="38" height="52" rx="2"/>
      <rect x="378" y="180" width="38" height="52" rx="2"/><rect x="462" y="180" width="38" height="52" rx="2"/>
      <rect x="534" y="180" width="38" height="52" rx="2"/>
    </g>
    <g fill="#e4b557" opacity=".24">
      <rect x="42"  y="250" width="38" height="46" rx="2"/><rect x="126" y="250" width="38" height="46" rx="2"/>
      <rect x="210" y="250" width="38" height="46" rx="2"/><rect x="294" y="250" width="38" height="46" rx="2"/>
      <rect x="378" y="250" width="38" height="46" rx="2"/><rect x="462" y="250" width="38" height="46" rx="2"/>
      <rect x="534" y="250" width="38" height="46" rx="2"/>
    </g>
    <!-- steps -->
    <rect x="-46" y="324" width="692" height="14" fill="url(#c-face)"/>
    <rect x="-62" y="338" width="724" height="14" fill="#c9a227" opacity=".36"/>
    <rect x="-78" y="352" width="756" height="14" fill="#c9a227" opacity=".22"/>
  </g>

  <!-- ground -->
  <rect y="640" width="800" height="360" fill="#071d39"/>
  <path d="M0 640 H800" stroke="#c9a227" stroke-width="1.2" opacity=".3"/>

  <!-- student figures (abstract) -->
  <g fill="#e4b557" opacity=".55">
    <g><circle cx="180" cy="690" r="9"/><path d="M168 742 q12-38 24 0 z"/></g>
    <g><circle cx="214" cy="696" r="8"/><path d="M203 744 q11-34 22 0 z"/></g>
    <g><circle cx="430" cy="688" r="9"/><path d="M418 742 q12-40 24 0 z"/></g>
    <g><circle cx="463" cy="694" r="8"/><path d="M452 744 q11-36 22 0 z"/></g>
    <g><circle cx="496" cy="691" r="8"/><path d="M485 743 q11-37 22 0 z"/></g>
    <g><circle cx="640" cy="694" r="8"/><path d="M629 744 q11-36 22 0 z"/></g>
  </g>
  <!-- path lines -->
  <g stroke="#2e86d0" stroke-width="1" opacity=".28" fill="none">
    <path d="M0 800 Q400 750 800 812"/>
    <path d="M0 880 Q400 836 800 892"/>
  </g>

  <rect width="800" height="1000" fill="url(#c-vig)"/>
</svg>
